<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celestial Eclipse Finder (Offline)</title>
  <style>
    :root {
      --bg:           #050512;
      --surface:      rgba(15, 15, 42, 0.7);
      --border:       rgba(255, 255, 255, 0.1);
      --border-hover: rgba(255, 255, 255, 0.2);
      --text:         #e8eaf6;
      --muted:        #9fa8da;
      --accent:       #7986cb;
      --solar:        #ffb300;
      --lunar:        #9fa8da;
      --glass:        backdrop-filter: blur(12px) saturate(180%);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .nebula {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(121, 134, 203, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(255, 179, 0, 0.1) 0%, transparent 40%);
      z-index: -1;
    }

    .stars {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: url('https://www.transparenttextures.com/patterns/stardust.png');
      opacity: 0.3;
      z-index: -1;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    header { text-align: center; margin-bottom: 50px; }
    h1 { font-size: 2.5rem; font-weight: 800; background: linear-gradient(135deg, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { color: var(--muted); }

    .search-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 30px;
      display: flex;
      gap: 15px;
      align-items: flex-end;
      margin-bottom: 40px;
      var(--glass);
    }

    .field { flex: 1; }
    .field label { display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
    input[type="number"] { width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); border-radius: 12px; color: #fff; font-size: 1.2rem; padding: 12px 18px; outline: none; }
    .btn { background: linear-gradient(135deg, #ffb300, #ff6f00); color: #1a0a00; border: none; border-radius: 12px; padding: 14px 28px; font-weight: 700; cursor: pointer; }

    .eclipse-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 20px;
      var(--glass);
    }

    .orb { width: 48px; height: 48px; border-radius: 50%; }
    .orb-solar { background: radial-gradient(circle, #000 40%, #ffb300 70%); box-shadow: 0 0 15px #ffb300; }
    .orb-lunar { background: radial-gradient(circle, #7f0000 30%, #e53935 90%); box-shadow: 0 0 15px #e53935; }

    .card-content { flex: 1; }
    .card-date { font-size: 1.1rem; font-weight: 700; }
    .badge { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; padding: 3px 10px; border-radius: 6px; margin-top: 5px; display: inline-block; }
    .badge-solar { background: rgba(255, 179, 0, 0.1); color: var(--solar); border: 1px solid rgba(255,179,0,0.2); }
    .badge-lunar { background: rgba(121, 134, 203, 0.1); color: var(--lunar); border: 1px solid rgba(121,134,203,0.2); }

    .btn:hover { background: linear-gradient(135deg, #ffca28, #f57c00); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 179, 0, 0.3); transition: all 0.3s ease; }
    .btn:active { transform: translateY(0); }

    .eclipse-card:hover { border-color: var(--border-hover); transform: translateX(5px); transition: all 0.3s ease; }

    .error-msg { text-align: center; padding: 2rem; color: #ff5252; background: rgba(255, 82, 82, 0.1); border-radius: 12px; border: 1px solid rgba(255, 82, 82, 0.2); }
  </style>
</head>

        <div class="orb orb-${e.type.toLowerCase()}"></div>
        <div class="card-content">

        </div>
      </div>
    `).join('');
  }

    if (e.key === 'Enter') {
      search();
    }
